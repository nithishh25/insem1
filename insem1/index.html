
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Course Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Online Course Management System</h1>
        <p>Learn new skills anytime, anywhere!</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#courses">Courses</a>
        <a href="#add-course">Add Course</a>
    </nav>

    <section class="hero" id="home">
        <h2>Welcome to Online Learning</h2>
        <p>Explore courses and improve your skills.</p>
        <a href="#courses" class="btn">Explore Courses</a>
    </section>

    <section id="courses">
        <h2>Available Courses</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Search courses..."
            oninput="displayCourses()"
        >

        <div id="courseList" class="course-container"></div>
    </section>

    <section id="add-course">
        <h2>Add a New Course</h2>

        <form id="courseForm">
            <input type="text" id="courseName"
                   placeholder="Course name" required>

            <input type="text" id="instructor"
                   placeholder="Instructor name" required>

            <input type="number" id="duration"
                   placeholder="Duration in hours"
                   min="1" required>

            <button type="submit">Add Course</button>
        </form>

        <p id="message"></p>
    </section>

    <footer>
        <p>&copy; 2026 Online Course Management System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
